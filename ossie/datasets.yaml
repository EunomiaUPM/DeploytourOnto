version: "1.0.0"
spec: "Apache-Ossie-OSI/v1"
description: "DEPLOYTOUR Physical Datasets Registration for FIWARE and SEGITTUR Iceberg Lakehouses"

datasets:
  - id: "fiware_accommodations"
    catalog: "fiware_catalog"
    namespace: "tourism"
    table: "accommodations"
    format: "iceberg"
    metadata_location: "/data/lakehouse_a_fiware/metadata/v1.metadata.json"
    ontology:
      standard: "FIWARE Smart Data Models"
      uri: "https://smartdatamodels.org/dataModel.PointOfInterest"
      conceptual_entities:
        - "TouristDestination"
        - "Accommodation"
    schema:
      columns:
        - name: "id"
          type: "STRING"
          description: "Unique accommodation identifier (URN/UUID)"
          primary_key: true
        - name: "name"
          type: "STRING"
          description: "Commercial establishment name"
        - name: "category"
          type: "STRING"
          description: "Type of accommodation: Hotel, Hostal, Camping, Apartment"
        - name: "capacity_beds"
          type: "INT32"
          description: "Total licensed bed capacity"
        - name: "occupancy_rate"
          type: "FLOAT"
          description: "Current monthly average occupancy rate [0.0 - 1.0]"
        - name: "latitude"
          type: "FLOAT"
          description: "WGS84 Latitude coordinate"
        - name: "longitude"
          type: "FLOAT"
          description: "WGS84 Longitude coordinate"
        - name: "municipality_code"
          type: "STRING"
          description: "Spanish INE 5-digit municipality code (e.g., 28079 for Madrid)"

  - id: "segittur_destinos"
    catalog: "segittur_catalog"
    namespace: "tourism"
    table: "destinos"
    format: "iceberg"
    metadata_location: "/data/lakehouse_b_segittur/metadata/v1.metadata.json"
    ontology:
      standard: "SEGITTUR / Schema.org Tourism Semantics"
      uri: "http://schema.org/TouristDestination"
      conceptual_entities:
        - "PuntoDeInteresTuristico"
        - "DestinoTuristicoFlujo"
    schema:
      columns:
        - name: "id_destino"
          type: "STRING"
          description: "Identifier for tourism resource or destination"
          primary_key: true
        - name: "denominacion_recurso"
          type: "STRING"
          description: "Official name of the tourism resource"
        - name: "tipo_espacio"
          type: "STRING"
          description: "SEGITTUR space typology: AlojamientoHotelero, ZonaAcampada, RecursoCultural, EspacioNatural"
        - name: "visitantes_mensuales"
          type: "INT32"
          description: "Estimated monthly footfall/visitor volume"
        - name: "gasto_medio_diario_eur"
          type: "FLOAT"
          description: "Average daily expenditure per tourist in EUR"
        - name: "latitud"
          type: "FLOAT"
          description: "WGS84 Latitud coordinate"
        - name: "longitud"
          type: "FLOAT"
          description: "WGS84 Longitud coordinate"
        - name: "codigo_ine_municipio"
          type: "STRING"
          description: "Codigo INE de municipio de 5 digitos"
