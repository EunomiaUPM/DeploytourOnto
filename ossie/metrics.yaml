version: "1.0.0"
spec: "Apache-Ossie-OSI/v1"
description: "DEPLOYTOUR Derived Analytics Expressions and Metrics Specification"

metrics:
  - id: "TotalBeds"
    name: "Total Bed Capacity"
    description: "Aggregated available beds across accommodations in the area"
    expression: "SUM(capacity_beds)"
    entity: "fiware_accommodations"
    data_type: "INT64"

  - id: "EffectiveGuests"
    name: "Effective Active Guests"
    description: "Estimated concurrently accommodated visitors based on bed capacity and occupancy rate"
    expression: "SUM(capacity_beds * occupancy_rate)"
    entity: "fiware_accommodations"
    data_type: "FLOAT"

  - id: "MonthlyTourismExpenditure"
    name: "Monthly Tourism Expenditure (EUR)"
    description: "Total monthly tourist spend generated by destination visitors"
    expression: "SUM(visitantes_mensuales * gasto_medio_diario_eur)"
    entity: "segittur_destinos"
    data_type: "FLOAT"

  - id: "TourismPressureIndex"
    name: "Tourism Pressure Index"
    description: "Ratio of monthly visitors to maximum theoretical monthly bed-night capacity (capacity * 30 days)"
    expression: "visitantes_mensuales / NULLIF(SUM(capacity_beds) * 30.0, 0)"
    entities:
      - "fiware_accommodations"
      - "segittur_destinos"
    data_type: "FLOAT"
